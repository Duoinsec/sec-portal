<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SEC Portal - Sengunthar Engineering College</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: linear-gradient(135deg, #123B73 0%, #1468D5 100%);
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: #ffffff;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }
    .logo-container img { width: 100%; height: 100%; object-fit: contain; }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 6px; letter-spacing: 0.5px; }
    p { font-size: 13px; opacity: 0.85; margin-bottom: 24px; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo-container">
      <img src="images/sec-logo.png" alt="SEC Logo">
    </div>
    <h1>SENGUNTHAR ENGINEERING COLLEGE</h1>
    <p>AI College Assistant & Portal</p>
    <div class="spinner"></div>
  </div>
  <script>
    // In Capacitor or standalone WebView, redirect to the portal entry point
    setTimeout(() => {
      window.location.href = '/login';
    }, 600);
  </script>
</body>
</html>
