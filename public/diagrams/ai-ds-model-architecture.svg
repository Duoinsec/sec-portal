<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background:#090d16; border-radius: 12px; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="aiGrad1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06b6d4"/><stop offset="1%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="aiGrad2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="1%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="aiGrad3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="1%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="aiGrad4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ec4899"/><stop offset="1%" stop-color="#db2777"/></linearGradient>
    <linearGradient id="aiGrad5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="1%" stop-color="#059669"/></linearGradient>
  </defs>

  <text x="400" y="38" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">AI &amp; DATA SCIENCE ARCHITECTURE PIPELINE</text>
  <text x="400" y="58" text-anchor="middle" fill="#94a3b8" font-size="13">Department of Artificial Intelligence &amp; Data Science (AI &amp; DS) – SEC</text>

  <!-- Step 1: Raw Data -->
  <rect x="30" y="95" width="130" height="160" rx="10" fill="url(#aiGrad1)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="95" y="130" text-anchor="middle" fill="#ffffff" font-size="22">📊</text>
  <text x="95" y="158" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1. Data Ingestion</text>
  <text x="95" y="180" text-anchor="middle" fill="#cffafe" font-size="10">Big Data / DBs</text>
  <text x="95" y="196" text-anchor="middle" fill="#cffafe" font-size="10">APIs &amp; Sensors</text>
  <text x="95" y="212" text-anchor="middle" fill="#a5f3fc" font-size="10">College Records</text>

  <!-- Arrow 1 -->
  <path d="M 165 175 L 180 175" stroke="#22d3ee" stroke-width="3" fill="none"/>
  <polygon points="183,175 175,170 175,180" fill="#22d3ee"/>

  <!-- Step 2: Processing -->
  <rect x="185" y="95" width="130" height="160" rx="10" fill="url(#aiGrad2)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="250" y="130" text-anchor="middle" fill="#ffffff" font-size="22">⚡</text>
  <text x="250" y="158" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2. Preprocessing</text>
  <text x="250" y="180" text-anchor="middle" fill="#e0e7ff" font-size="10">Tokenization</text>
  <text x="250" y="196" text-anchor="middle" fill="#e0e7ff" font-size="10">Vector Embedding</text>
  <text x="250" y="212" text-anchor="middle" fill="#c7d2fe" font-size="10">Normalization</text>

  <!-- Arrow 2 -->
  <path d="M 320 175 L 335 175" stroke="#818cf8" stroke-width="3" fill="none"/>
  <polygon points="338,175 330,170 330,180" fill="#818cf8"/>

  <!-- Step 3: Neural Model -->
  <rect x="340" y="95" width="130" height="160" rx="10" fill="url(#aiGrad3)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="405" y="130" text-anchor="middle" fill="#ffffff" font-size="22">🧠</text>
  <text x="405" y="158" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3. Model Training</text>
  <text x="405" y="180" text-anchor="middle" fill="#f3e8ff" font-size="10">Transformer / LLM</text>
  <text x="405" y="196" text-anchor="middle" fill="#f3e8ff" font-size="10">Neural Attention</text>
  <text x="405" y="212" text-anchor="middle" fill="#e9d5ff" font-size="10">Nvidia GPU Clusters</text>

  <!-- Arrow 3 -->
  <path d="M 475 175 L 490 175" stroke="#c084fc" stroke-width="3" fill="none"/>
  <polygon points="493,175 485,170 485,180" fill="#c084fc"/>

  <!-- Step 4: Evaluation -->
  <rect x="495" y="95" width="130" height="160" rx="10" fill="url(#aiGrad4)" stroke="#f472b6" stroke-width="1.5"/>
  <text x="560" y="130" text-anchor="middle" fill="#ffffff" font-size="22">🎯</text>
  <text x="560" y="158" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4. Evaluation</text>
  <text x="560" y="180" text-anchor="middle" fill="#fce7f3" font-size="10">Accuracy &amp; Loss</text>
  <text x="560" y="196" text-anchor="middle" fill="#fce7f3" font-size="10">Safety &amp; Alignment</text>
  <text x="560" y="212" text-anchor="middle" fill="#fbcfe8" font-size="10">F1 Score Tuning</text>

  <!-- Arrow 4 -->
  <path d="M 630 175 L 645 175" stroke="#f472b6" stroke-width="3" fill="none"/>
  <polygon points="648,175 640,170 640,180" fill="#f472b6"/>

  <!-- Step 5: Deployment -->
  <rect x="650" y="95" width="120" height="160" rx="10" fill="url(#aiGrad5)" stroke="#34d399" stroke-width="1.5"/>
  <text x="710" y="130" text-anchor="middle" fill="#ffffff" font-size="22">🚀</text>
  <text x="710" y="158" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5. Inference API</text>
  <text x="710" y="180" text-anchor="middle" fill="#d1fae5" font-size="10">Groq Acceleration</text>
  <text x="710" y="196" text-anchor="middle" fill="#d1fae5" font-size="10">REST API Streaming</text>
  <text x="710" y="212" text-anchor="middle" fill="#a7f3d0" font-size="10">Chat UI Client</text>

  <!-- Bottom Details -->
  <rect x="30" y="280" width="740" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="308" fill="#38bdf8" font-size="13" font-weight="700">AI &amp; Data Science at Sengunthar Engineering College:</text>
  <text x="50" y="330" fill="#cbd5e1" font-size="11">Specialized B.Tech program focused on Machine Learning, Natural Language Processing, Computer Vision, Big Data, and Generative AI.</text>
  <text x="50" y="350" fill="#94a3b8" font-size="11">State-of-the-art GPU labs, industry projects with Zoho &amp; TCS, and Anna University curriculum alignment.</text>
</svg>
