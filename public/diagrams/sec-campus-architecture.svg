<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0b132b; border-radius: 12px; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="mainBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="1%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="techBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="1%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="coreBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="1%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="libraryBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="1%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="placementBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="1%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">SENGUNTHAR ENGINEERING COLLEGE</text>
  <text x="400" y="58" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">Campus Layout &amp; Department Infrastructure Architecture</text>

  <!-- Main Entrance & Road -->
  <rect x="40" y="80" width="720" height="24" rx="4" fill="#1e293b"/>
  <text x="400" y="96" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="2">MAIN ENTRANCE &amp; AVENUE ROAD (TIRUCHENGODE)</text>

  <!-- ROW 1 -->
  <!-- Main Admin Block -->
  <rect x="50" y="125" width="335" height="100" rx="10" fill="url(#mainBlock)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="217" y="152" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">🏛️ MAIN ADMINISTRATIVE BLOCK</text>
  <text x="217" y="174" text-anchor="middle" fill="#dbeafe" font-size="11">Principal Office · Administrative Section</text>
  <text x="217" y="194" text-anchor="middle" fill="#bfdbfe" font-size="11">Exam Cell · Anna University Affiliation Office</text>
  <text x="217" y="212" text-anchor="middle" fill="#93c5fd" font-size="10">Accounts &amp; Student Welfare Centre</text>

  <!-- Central Library & Research -->
  <rect x="415" y="125" width="335" height="100" rx="10" fill="url(#libraryBlock)" stroke="#34d399" stroke-width="1.5"/>
  <text x="582" y="152" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">📚 CENTRAL DIGITAL LIBRARY</text>
  <text x="582" y="174" text-anchor="middle" fill="#d1fae5" font-size="11">50,000+ Technical Books &amp; IEEE Journals</text>
  <text x="582" y="194" text-anchor="middle" fill="#a7f3d0" font-size="11">Digital E-Learning Lab · R&amp;D Research Wing</text>
  <text x="582" y="212" text-anchor="middle" fill="#6ee7b7" font-size="10">Air Conditioned Reading Halls</text>

  <!-- CENTRAL CORRIDOR -->
  <rect x="50" y="240" width="700" height="20" rx="4" fill="#1e293b"/>
  <text x="400" y="254" text-anchor="middle" fill="#64748b" font-size="10" font-weight="600" letter-spacing="1">CENTRAL ACADEMIC CORRIDOR &amp; QUADRANGLE</text>

  <!-- ROW 2 -->
  <!-- Tech Block (AI&DS, CSE, ECE, EEE) -->
  <rect x="50" y="275" width="335" height="110" rx="10" fill="url(#techBlock)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="217" y="302" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">💻 CIRCUIT DISCIPLINES BLOCK</text>
  <text x="217" y="324" text-anchor="middle" fill="#e0f2fe" font-size="11">AI &amp; DS (Artificial Intelligence &amp; Data Science)</text>
  <text x="217" y="344" text-anchor="middle" fill="#bae6fd" font-size="11">CSE (Computer Science) · ECE · EEE</text>
  <text x="217" y="366" text-anchor="middle" fill="#7dd3fc" font-size="10">Nvidia GPU AI Lab · Advanced Cloud Computing Lab</text>

  <!-- Placement & Auditorium -->
  <rect x="415" y="275" width="335" height="110" rx="10" fill="url(#placementBlock)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="582" y="302" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">🎯 TRAINING &amp; PLACEMENT CELL</text>
  <text x="582" y="324" text-anchor="middle" fill="#f3e8ff" font-size="11">Corporate Interview Rooms &amp; GD Chambers</text>
  <text x="582" y="344" text-anchor="middle" fill="#e9d5ff" font-size="11">1200-Seater Air Conditioned Auditorium</text>
  <text x="582" y="366" text-anchor="middle" fill="#d8b4fe" font-size="10">Soft Skills &amp; Technical Training Suites</text>

  <!-- ROW 3 -->
  <!-- Core Engineering Block (Mech, Civil) -->
  <rect x="50" y="400" width="335" height="80" rx="10" fill="url(#coreBlock)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="217" y="425" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">⚙️ CORE DISCIPLINES &amp; WORKSHOPS</text>
  <text x="217" y="445" text-anchor="middle" fill="#fef3c7" font-size="11">Mechanical Engineering · Civil Engineering</text>
  <text x="217" y="465" text-anchor="middle" fill="#fde68a" font-size="10">CAD/CAM CNC Labs · Materials &amp; Thermal Labs</text>

  <!-- Hostels & Sports Ground -->
  <rect x="415" y="400" width="335" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="582" y="425" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">🏃 HOSTELS &amp; ATHLETIC GROUNDS</text>
  <text x="582" y="445" text-anchor="middle" fill="#cbd5e1" font-size="11">Boys Hostel · Girls Hostel · Cafeteria &amp; Mess</text>
  <text x="582" y="465" text-anchor="middle" fill="#94a3b8" font-size="10">Cricket Ground · Basketball &amp; Badminton Courts</text>
</svg>
